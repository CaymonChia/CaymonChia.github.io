<style>
html,body{margin:0;height:100%;background:#EFE4D6;color:#3B2A1F;font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi","Noto Sans Thai",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#lock{height:100dvh;max-width:480px;margin:0 auto;background:#FFF5EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 28px;box-sizing:border-box;text-align:center}
#lock[hidden]{display:none}
#lock .badge{width:96px;height:96px;border-radius:50%;background:#C9543B;color:#fff;display:flex;align-items:center;justify-content:center;font:700 34px ui-rounded,system-ui,sans-serif;box-shadow:0 6px 0 #9E3D28}
#lock h1{margin:6px 0 0;font:700 24px ui-rounded,system-ui,sans-serif}
#lock p{margin:0;color:#7A6253;font-size:15px}
#lock form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
#lock input[type=password]{width:100%;box-sizing:border-box;font-size:18px;padding:15px 16px;border-radius:16px;border:1.5px solid #EADBC8;background:#fff;color:#3B2A1F;outline:none;text-align:center}
#lock input[type=password]:focus{border-color:#C9543B}
#lock label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#5A3D12}
#lock button{width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:600;font-family:inherit;background:#C9543B;color:#fff;cursor:pointer}
#lock button[disabled]{opacity:.6}
#err{min-height:20px;color:#9E3D28;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="badge">Aa</div>
  <h1>ใส่รหัสผ่าน · Password</h1>
  <p>แอปนี้ล็อกไว้ · This app is locked</p>
  <form id="f" autocomplete="on">
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="รหัสผ่าน · password" required>
    <label><input id="rem" type="checkbox" checked> จำไว้ในเครื่องนี้ · Remember on this phone</label>
    <button id="go" type="submit">เปิด · Unlock</button>
    <div id="err"></div>
  </form>
</div>
